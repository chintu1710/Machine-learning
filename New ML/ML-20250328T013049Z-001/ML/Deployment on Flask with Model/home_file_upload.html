<!DOCTYPE html>

<html lang="en">

<head>
	<title>Digit Recognition</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
	
	<style>
		/* Remove the navbar's default margin-bottom and rounded borders */ 
		.navbar {
		margin-bottom: 0;
		border-radius: 0;
		}
		
		/* Add a gray background color and some padding to the footer */
		footer {
		background-color: #f2f2f2;
		padding: 25px;
		}
	</style>
	
</head>

<body>

<div class="jumbotron" style="background-color:#337ab7; padding-top:20px; padding-bottom:30px">
	<div class="container text-center">
		<h2 style="color:#eee"><b>Handwritten Digit Recognition Using Machine Learning<b></h2>      
	</div>
</div>
  
<form action="" method="post" enctype="multipart/form-data" >
	
	<div class="container-fluid bg-3 text-center">
		<div class="row">
			<div class="col-sm-2"> 
			</div>
			
			<div class="col-sm-8">
				<span class="btn btn-default btn-file">
				<input type="file" name="file" required>
				</span>
				<input type="submit" value="Upload your image" class="btn btn-primary" required>
			</div>			
		</div>
	</div>
	<br>
	<div class="container-fluid bg-3 text-center">
		<div class="row">
			<div class="col-sm-6">
				<div class="row">
					<div class="col-sm-2">
					</div>
					<div class="col-sm-8">
						<h3><b>Input Image</b></h3>
						<hr style="height:2px;border-width:0;color:gray;background-color:gray">
						<img src="{{imagesource}}" id="uploaded" class="img-responsive" style="height:350px; width:100%" alt="">
					</div>
				</div>
				<div class="row">
					<div class="col-sm-2">
					</div>
					<div class="col-sm-8"> 
						<h3>Prediction: <b>{{label}}</b></h3>
					</div>
				</div>
			</div>
			<div class="col-sm-6">
				<div class="row">
					<div class="col-sm-1">
					</div>
					<div class="col-sm-10">
						<center><h3 class="ml-12"><b>Data Set Images of Handwritten Digit</b></h3>
						<hr style="height:2px;border-width:0;color:gray;background-color:gray">
						<img src="../static/Graphs/model_accuracy_tune_model.png" class="ml-12" height="350" width="100%" alt="" style="vertical-align:middle" ></center>
					</div>
				</div>
			</div>
		</div>
	</div>	
</form>

</body>
<!-- Footer -->

</html>
